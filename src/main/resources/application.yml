server:
  port: 8083
  # Al recibir SIGTERM (docker service update / scale down) termina las peticiones en curso
  shutdown: graceful

spring:
  application:
    name: ms-agenda
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Secretos de Docker Swarm montados en /run/secrets: cada archivo es una propiedad
  # (por ejemplo spring.datasource.password). Si no existen se usan las variables de entorno.
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agenda_db}
    username: ${DB_USERNAME:respirar}
    password: ${DB_PASSWORD:respirar}
    hikari:
      # Pool elástico: todas las réplicas comparten la misma instancia RDS (max_connections = 81 en
      # db.t3.micro). En reposo cada réplica mantiene 1 conexión y crece hasta 4 con carga, así caben
      # el escalado y los rolling updates start-first (réplicas nuevas y viejas conviven un momento).
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: ${DB_POOL_MIN:1}
      idle-timeout: ${DB_POOL_IDLE_MS:60000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # La API devuelve entidades JPA con colecciones LAZY: se serializan dentro de la sesión
    open-in-view: true

# Eventos de dominio de citas: si SQS_COLA_CITAS_URL está vacío (desarrollo local) los eventos
# solo se registran en el log; en la nube se publican en la cola SQS rys-citas-eventos.
rys:
  eventos:
    sqs:
      url: ${SQS_COLA_CITAS_URL:}
      region: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  servicio: ms-agenda
  descripcion: Agendamiento de citas (RF-04 y RF-05) con confirmación asíncrona por Amazon SQS
  version: ${APP_VERSION:local}
